<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Visit Bay Area — SF to Big Sur</title>
    <meta name="description" content="A public map of San Francisco food and views plus Marin, San Jose, Santa Cruz, Monterey, Carmel, and Big Sur hidden gems." />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="canonical" href="https://pruthvirajg.github.io/visitbayarea/" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Figtree:wght@400;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="bar">
      <div class="brand">
        <span class="shield">BA</span>
        <div>
          <h1>Visit Bay Area</h1>
          <p id="count">SF to Big Sur</p>
        </div>
      </div>
      <button class="cta" id="bucket-tab" type="button">My trip</button>
    </header>
    <div class="layout">
      <div id="map" role="application" aria-label="Bay Area map"></div>
      <aside class="panel">
        <label class="search">
          <input id="q" type="search" placeholder="Stop, town, sunset, ramen" autocomplete="off" />
        </label>
        <div id="list" class="list"></div>
      </aside>
    </div>
    <footer class="foot">
      <a href="https://github.com/pruthvirajg/visitbayarea">Source</a>
      <a href="https://github.com/pruthvirajg/route66">Sister map · Route 66</a>
      <a href="https://www.instagram.com/a_travelling_machine/">Pruthvi Studios</a>
    </footer>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <script src="./app.js"></script>
  </body>
</html>
